# Apache SSL/TLS Security Hardening Configuration
#
# Installation:
# 1. Copy to /etc/apache2/conf-available/ssl-hardening.conf
# 2. sudo a2enconf ssl-hardening
# 3. sudo systemctl reload apache2

# Disable SSL compression (CRIME attack mitigation)
SSLCompression off

# Disable SSL session tickets (security consideration)
SSLSessionTickets off

# Enable HSTS (HTTP Strict Transport Security)
Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

# Prevent MIME-sniffing
Header always set X-Content-Type-Options "nosniff"

# Enable XSS protection
Header always set X-XSS-Protection "1; mode=block"

# Clickjacking protection
Header always set X-Frame-Options "SAMEORIGIN"

# Referrer policy
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Content Security Policy (adjust as needed for BitB pages)
# Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"

# Permissions Policy
Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

# Modern SSL/TLS protocols only
SSLProtocol -all +TLSv1.2 +TLSv1.3

# Strong cipher suites
SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384

# Disable server cipher order preference (let client choose)
SSLHonorCipherOrder off

# OCSP Stapling
SSLUseStapling on
SSLStaplingResponderTimeout 5
SSLStaplingReturnResponderErrors off
SSLStaplingCache shmcb:/var/run/ocsp(128000)

# Session configuration
SSLSessionCache shmcb:/var/cache/mod_ssl/scache(512000)
SSLSessionCacheTimeout 300

# Hide server version
ServerTokens Prod
ServerSignature Off

# Disable TRACE method
TraceEnable Off

# Set timeout values
Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
